<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GachaVerse 3D</title>

<!-- Firebase 10.12.0 compat scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-auth-compat.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&display=swap');

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#03030f;
  font-family:'Rajdhani',sans-serif;color:#e8e8ff;}
#three-canvas{position:fixed;top:0;left:0;display:block;z-index:0;}

/* CSS Containment для производительности */
#box-panel, .modal, #result-box, #inv-grid {
  contain: layout style paint;
}

/* ── SAVE INDICATOR ── */
#save-indicator{
  position:fixed;bottom:125px;right:14px;z-index:300;
  font-family:'Orbitron',monospace;font-size:0.6rem;font-weight:700;
  color:rgba(77,255,153,0.5);letter-spacing:0.08em;
  opacity:0;transition:opacity 0.4s;pointer-events:none;
  will-change: opacity;
}
#save-indicator.show{opacity:1;}

/* ── GEM COUNTER ── */
#gem-counter{
  position:fixed;top:14px;right:14px;z-index:200;
  background:rgba(3,3,15,0.88);
  border:1.5px solid #ffd700;border-radius:50px;
  padding:9px 22px 9px 14px;
  font-family:'Orbitron',monospace;font-size:1.45rem;font-weight:700;
  color:#ffd700;display:flex;align-items:center;gap:9px;
  backdrop-filter:blur(16px);
  box-shadow:0 0 24px rgba(255,215,0,0.28),0 0 60px rgba(255,215,0,0.08),inset 0 0 12px rgba(255,215,0,0.04);
  text-shadow:0 0 12px #ffd700;user-select:none;
  transition:transform 0.15s;
  will-change: transform;
}
#gem-counter.gem-pop{animation:gemPop 0.35s ease;}
@keyframes gemPop{0%{transform:scale(1);}50%{transform:scale(1.12);}100%{transform:scale(1);}}

/* ── TITLE ── */
#game-title{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;
  font-family:'Orbitron',monospace;font-size:1.05rem;font-weight:900;
  letter-spacing:0.18em;text-transform:uppercase;
  background:linear-gradient(135deg,#7a44ff,#ff44aa,#ffaa00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;pointer-events:none;
  will-change: transform;
}

/* ── TOP-LEFT BUTTONS ── */
#top-buttons{position:fixed;top:14px;left:14px;z-index:200;display:flex;gap:8px;flex-wrap:wrap;}
.top-btn{
  background:rgba(3,3,15,0.82);border:1.5px solid rgba(180,150,255,0.25);
  border-radius:10px;padding:9px 15px;cursor:pointer;
  font-family:'Rajdhani',sans-serif;font-size:0.88rem;font-weight:700;
  color:#c8b8ff;letter-spacing:0.04em;
  backdrop-filter:blur(14px);transition:all 0.2s;user-select:none;
  will-change: transform;
}
.top-btn:hover{border-color:rgba(180,150,255,0.6);color:#fff;transform:translateY(-2px);
  box-shadow:0 4px 20px rgba(120,80,255,0.25);}

/* ── SOUND TOGGLE ── */
#sound-btn{
  position:fixed;top:14px;right:190px;z-index:200;
  background:rgba(3,3,15,0.82);border:1.5px solid rgba(180,150,255,0.25);
  border-radius:10px;padding:9px 15px;cursor:pointer;
  font-family:'Rajdhani',sans-serif;font-size:0.88rem;font-weight:700;
  color:#c8b8ff;letter-spacing:0.04em;
  backdrop-filter:blur(14px);transition:all 0.2s;user-select:none;
}
#sound-btn:hover{border-color:rgba(180,150,255,0.6);color:#fff;transform:translateY(-2px);}
#sound-btn.muted{border-color:rgba(255,80,80,0.35);color:#ff8888;}

/* ── BOTTOM BOX PANEL ── */
#box-panel{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:linear-gradient(180deg,transparent 0%,rgba(3,3,15,0.98) 28%);
  padding:10px 12px 18px 12px;
  display:flex;gap:10px;overflow-x:auto;align-items:flex-end;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.15) transparent;
  content-visibility: auto;
  contain-intrinsic-height: 200px;
}
#box-panel::-webkit-scrollbar{height:3px;}
#box-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}

.box-card{
  flex-shrink:0;width:158px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;padding:11px;
  display:flex;flex-direction:column;gap:6px;
  transition:border-color 0.3s,box-shadow 0.3s,transform 0.2s;
  position:relative;overflow:hidden;
  contain: layout style;
}
.box-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--box-color,#7a44ff);
  box-shadow:0 0 12px var(--box-color,#7a44ff);
}
.box-card:hover{transform:translateY(-3px);}
.box-card-name{
  font-family:'Orbitron',monospace;font-size:0.72rem;font-weight:900;
  text-transform:uppercase;letter-spacing:0.06em;
  color:var(--box-color,#7a44ff);
}
.box-card-cost{font-size:0.82rem;font-weight:700;color:#ffd700;display:flex;align-items:center;gap:4px;}
.box-card-rates{font-size:0.68rem;color:rgba(255,255,255,0.45);line-height:1.55;}
.rate-rare{color:#4ab3ff;}.rate-epic{color:#c066ff;}.rate-leg{color:#ffaa00;}.rate-ultra{color:#ff4444;}
.open-btn{
  margin-top:4px;padding:9px 6px;border:none;border-radius:9px;
  font-family:'Rajdhani',sans-serif;font-size:0.85rem;font-weight:700;
  cursor:pointer;text-transform:uppercase;letter-spacing:0.06em;
  color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--box-color,#7a44ff)bb,var(--box-color,#7a44ff)66);
  transition:all 0.2s;border:1px solid var(--box-color,#7a44ff)66;
  will-change: transform;
}
.open-btn:not(:disabled):hover{transform:translateY(-2px);filter:brightness(1.2);
  box-shadow:0 4px 18px var(--box-color,#7a44ff)66;}
.open-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none;}
.btn-x10{
  font-size:0.76rem;padding:7px 4px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#aaa;
}
.btn-x10:not(:disabled):hover{background:rgba(255,255,255,0.12);color:#fff;transform:translateY(-1px);}
.cooldown-bar{height:3px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;margin-top:2px;}
.cooldown-fill{height:100%;background:var(--box-color,#7a44ff);border-radius:2px;transition:width 0.1s linear;}
.cooldown-txt{font-size:0.67rem;color:#ff8844;text-align:center;height:13px;line-height:13px;}

/* ── MODALS ── */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:400;
  background:rgba(0,0,0,0.82);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.28s;
  content-visibility: auto;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:linear-gradient(145deg,#080818,#0d0d22);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:20px;padding:22px;width:92%;max-width:480px;
  max-height:82vh;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 0 80px rgba(0,0,0,0.9),0 0 40px rgba(120,80,255,0.08);
  transform:translateY(20px);transition:transform 0.28s;
  contain: layout style;
}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.08);}
.modal-title{font-family:'Orbitron',monospace;font-size:1rem;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;}
.modal-close{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);
  border-radius:8px;color:#888;padding:6px 13px;cursor:pointer;font-size:0.85rem;transition:all 0.2s;}
.modal-close:hover{background:rgba(255,255,255,0.12);color:#fff;}
.modal-body{overflow-y:auto;flex:1;padding-right:4px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.1) transparent;}
.modal-body::-webkit-scrollbar{width:3px;}
.modal-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);}

/* ── INVENTORY ── */
#inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;padding:2px;content-visibility: auto;}
.skin-card{
  border-radius:11px;padding:9px;cursor:pointer;
  border:2px solid transparent;transition:all 0.22s;
  text-align:center;position:relative;background:rgba(255,255,255,0.03);
  contain: layout style paint;
}
.skin-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.4);}
.skin-card.equipped{border-color:#fff !important;box-shadow:0 0 18px rgba(255,255,255,0.25);}
.skin-preview{width:78px;height:78px;border-radius:8px;margin:0 auto 7px;display:block;object-fit:cover;}
.skin-name{font-size:0.77rem;font-weight:700;line-height:1.3;}
.rarity-pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:0.63rem;font-weight:700;text-transform:uppercase;margin-top:5px;letter-spacing:0.05em;}
.skin-count{position:absolute;top:5px;right:5px;background:rgba(0,0,0,0.65);border-radius:20px;font-size:0.63rem;padding:2px 6px;color:#fff;}
.equipped-badge{font-size:0.65rem;color:#4dff99;margin-top:4px;font-weight:700;}
.empty-inv{text-align:center;padding:50px 20px;color:rgba(255,255,255,0.3);font-size:0.95rem;line-height:1.6;}

/* ── STATS ── */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.stat-label{color:rgba(255,255,255,0.55);font-size:0.9rem;}
.stat-value{font-family:'Orbitron',monospace;font-size:0.95rem;font-weight:700;}
.pity-bar-wrap{padding:12px 0;}
.pity-label{font-size:0.78rem;color:rgba(255,255,255,0.5);margin-bottom:5px;}
.pity-bar{height:6px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden;}
.pity-fill{height:100%;border-radius:3px;transition:width 0.5s;}

/* ── MISSIONS ── */
.mission-item{padding:13px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;margin-bottom:8px;contain: layout;}
.mission-name{font-size:0.92rem;font-weight:700;margin-bottom:2px;}
.mission-desc{font-size:0.75rem;color:rgba(255,255,255,0.45);margin-bottom:8px;}
.mission-prog-bar{height:5px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;margin-bottom:6px;}
.mission-prog-fill{height:100%;background:linear-gradient(90deg,#4ab3ff,#c066ff);border-radius:3px;transition:width 0.5s;}
.mission-footer{display:flex;justify-content:space-between;align-items:center;}
.mission-count{font-size:0.73rem;color:rgba(255,255,255,0.4);}
.claim-btn{padding:6px 14px;border:none;border-radius:8px;
  background:linear-gradient(135deg,#4dff99,#00cc66);color:#000;
  font-family:'Rajdhani',sans-serif;font-size:0.8rem;font-weight:700;cursor:pointer;transition:filter 0.2s;}
.claim-btn:hover{filter:brightness(1.15);}
.claimed-txt{font-size:0.75rem;color:#4dff99;font-weight:700;}
.reward-txt{font-size:0.75rem;color:#ffd700;}

/* ── RESULT POPUP ── */
#result-popup{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:600;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);
  transition:opacity 0.3s;
  content-visibility: auto;
}
#result-popup.show{opacity:1;pointer-events:all;}
#result-box{
  background:linear-gradient(145deg,#08081a,#10102a);
  border:1px solid rgba(255,255,255,0.15);border-radius:22px;
  padding:26px;width:92%;max-width:400px;max-height:80vh;overflow-y:auto;
  box-shadow:0 0 100px rgba(0,0,0,0.9),0 0 40px rgba(120,60,255,0.1);
  animation:popIn 0.38s cubic-bezier(0.175,0.885,0.32,1.275) both;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.1) transparent;
  contain: layout style;
}
@keyframes popIn{from{transform:scale(0.65) translateY(30px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
.result-title{font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:900;text-align:center;margin-bottom:18px;letter-spacing:0.08em;}
.result-item{display:flex;align-items:center;gap:11px;padding:10px;border-radius:11px;margin-bottom:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);contain: layout;}
.result-icon{width:42px;height:42px;border-radius:8px;flex-shrink:0;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:1.3rem;}
.result-item-name{font-size:0.95rem;font-weight:700;line-height:1.3;}
.result-item-sub{font-size:0.72rem;opacity:0.55;margin-top:2px;}
.result-new{color:#4dff99;font-size:0.72rem;font-weight:700;}
.result-dup{color:#ffd700;font-size:0.72rem;font-weight:700;}
.result-close-btn{
  width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#5533ff,#aa33ff);color:#fff;
  font-family:'Orbitron',monospace;font-size:0.85rem;font-weight:700;cursor:pointer;
  letter-spacing:0.06em;transition:filter 0.2s;text-transform:uppercase;
}
.result-close-btn:hover{filter:brightness(1.15);}

/* ── RARITY COLOR SYSTEM ── */
.rc-rare{color:#4ab3ff;}.rc-epic{color:#c066ff;}.rc-legend{color:#ffaa00;}.rc-ultra{color:#ff4444;}
.ri-rare{background:rgba(74,179,255,0.12);border-color:rgba(74,179,255,0.3)!important;}
.ri-epic{background:rgba(192,102,255,0.12);border-color:rgba(192,102,255,0.3)!important;}
.ri-legend{background:rgba(255,170,0,0.12);border-color:rgba(255,170,0,0.3)!important;}
.ri-ultra{background:rgba(255,68,68,0.12);border-color:rgba(255,68,68,0.3)!important;}
.pill-rare{background:rgba(74,179,255,0.18);color:#4ab3ff;}
.pill-epic{background:rgba(192,102,255,0.18);color:#c066ff;}
.pill-legend{background:rgba(255,170,0,0.18);color:#ffaa00;}
.pill-ultra{background:rgba(255,68,68,0.18);color:#ff4444;}
.card-rare{border-color:rgba(74,179,255,0.35)!important;}
.card-epic{border-color:rgba(192,102,255,0.35)!important;}
.card-legend{border-color:rgba(255,170,0,0.35)!important;}
.card-ultra{border-color:rgba(255,68,68,0.35)!important;}

/* ── ULTRA EFFECTS ── */
@keyframes ultraGlow{0%,100%{box-shadow:0 0 14px rgba(255,68,68,0.4);}50%{box-shadow:0 0 36px rgba(255,68,68,0.9),0 0 70px rgba(255,68,68,0.25);}}
.ultra-glow-card{animation:ultraGlow 1.6s ease-in-out infinite;}
@keyframes screenShake{0%,100%{transform:translateX(0);}15%{transform:translateX(-10px) rotate(-0.8deg);}30%{transform:translateX(10px) rotate(0.8deg);}45%{transform:translateX(-7px);}60%{transform:translateX(7px);}75%{transform:translateX(-4px);}90%{transform:translateX(4px);}}
.screen-shake{animation:screenShake 0.55s ease-in-out;}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:120px;left:50%;transform:translateX(-50%) translateY(30px);
  z-index:500;background:rgba(77,255,153,0.12);border:1px solid rgba(77,255,153,0.4);
  border-radius:50px;padding:9px 22px;font-size:0.85rem;font-weight:700;color:#4dff99;
  backdrop-filter:blur(10px);opacity:0;pointer-events:none;
  transition:opacity 0.3s,transform 0.3s;
  will-change: opacity, transform;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── CHARACTER LABEL ── */
#char-label{
  position:fixed;bottom:0;left:0;z-index:150;
  font-size:0.72rem;font-family:'Orbitron',monospace;
  color:rgba(255,255,255,0.35);padding:0 0 8px 14px;pointer-events:none;
}

/* ── LEADERBOARD MODAL ── */
#lb-grid{display:grid;grid-template-columns:40px 1fr 80px;gap:8px;align-items:center;padding:4px;}
.lb-header{font-size:0.7rem;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.05em;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,0.1);}
.lb-row{padding:10px 4px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:0.85rem;}
.lb-rank{font-family:'Orbitron',monospace;font-weight:900;color:#ffd700;width:32px;}
.lb-rank.top3{color:#ffaa00;text-shadow:0 0 8px rgba(255,170,0,0.5);}
.lb-name{color:#e8e8ff;}
.lb-score{font-family:'Orbitron',monospace;color:#4ab3ff;text-align:right;}
.lb-self{background:rgba(74,179,255,0.08);border-radius:6px;}
.username-btn{
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);
  border-radius:8px;color:#c8b8ff;padding:8px 16px;cursor:pointer;font-size:0.8rem;margin-top:12px;transition:all 0.2s;
}
.username-btn:hover{background:rgba(255,255,255,0.12);color:#fff;}

/* ── MOBILE ── */
@media(max-width:600px){
  #game-title{display:none;}
  #gem-counter{font-size:1.1rem;padding:7px 14px 7px 11px;}
  .box-card{width:142px;}
  .top-btn{font-size:0.78rem;padding:7px 11px;}
  .modal{padding:16px;}
  .modal-title{font-size:0.85rem;}
  #sound-btn{right:155px;padding:7px 11px;font-size:0.78rem;}
}
</style>
</head>
<body>

<canvas id="three-canvas"></canvas>
<div id="save-indicator">💾 SAVED</div>
<div id="game-title">⬡ GachaVerse 3D</div>
<div id="gem-counter"><span>💎</span><span id="gem-value">50</span></div>
<button id="sound-btn" onclick="toggleSound()">🔊 SFX</button>

<div id="top-buttons">
  <button class="top-btn" onclick="openModal('inv-modal')">🎒 Wardrobe</button>
  <button class="top-btn" onclick="openModal('stats-modal')">📊 Stats</button>
  <button class="top-btn" onclick="openModal('mission-modal')">🎯 Missions</button>
  <button class="top-btn" onclick="openModal('lb-modal')">🏆 Top</button>
</div>

<div id="box-panel"></div>
<div id="char-label">◈ Character Preview</div>

<!-- INVENTORY MODAL -->
<div class="modal-overlay" id="inv-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">🎒 Wardrobe</div>
      <button class="modal-close" onclick="closeModal('inv-modal')">✕ Close</button>
    </div>
    <div class="modal-body"><div id="inv-grid"></div></div>
  </div>
</div>

<!-- STATS MODAL -->
<div class="modal-overlay" id="stats-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">📊 Stats</div>
      <button class="modal-close" onclick="closeModal('stats-modal')">✕ Close</button>
    </div>
    <div class="modal-body" id="stats-body"></div>
  </div>
</div>

<!-- MISSION MODAL -->
<div class="modal-overlay" id="mission-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">🎯 Missions</div>
      <button class="modal-close" onclick="closeModal('mission-modal')">✕ Close</button>
    </div>
    <div class="modal-body" id="mission-body"></div>
  </div>
</div>

<!-- LEADERBOARD MODAL -->
<div class="modal-overlay" id="lb-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">🏆 Leaderboard</div>
      <button class="modal-close" onclick="closeModal('lb-modal')">✕ Close</button>
    </div>
    <div class="modal-body">
      <div id="lb-grid">
        <div class="lb-header">#</div>
        <div class="lb-header">Player</div>
        <div class="lb-header">Boxes</div>
      </div>
      <div id="lb-rows"></div>
      <button class="username-btn" onclick="promptUsername()">✏️ Change Username</button>
    </div>
  </div>
</div>

<!-- RESULT POPUP -->
<div id="result-popup">
  <div id="result-box">
    <div class="result-title" id="result-title">📦 Box Opened!</div>
    <div id="result-items"></div>
    <button class="result-close-btn" onclick="closeResult()">Continue →</button>
  </div>
</div>

<div id="toast"></div>

function saveState() {

    const ind = document.getElementById('save-indicator');
    ind.classList.add('show');

    saveState._t = setTimeout(() => ind.classList.remove('show'), 1200);
  } catch(e) {
    console.warn('Local save failed:', e);
  }
  
  // Cloud save with debounce
  if (!db || !currentUser) return;
  clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(() => {
    const cloudData = {
      gems: STATE.gems,
      ownedSkins: STATE.ownedSkins,
      equippedSkinId: STATE.equippedSkinId,
      stats: STATE.stats,

      .then(() => console.log('Cloud save success'))
      .catch(err => console.warn('Cloud save failed:', err));

function cloudLoad() {
  if (!db || !currentUser || isCloudLoading) return;
  isCloudLoading = true;
  
  db.collection('players').doc(currentUser.uid).get()
    .then(doc => {
      if (doc.exists) {
        const cloud = doc.data();
        // Merge cloud data with local
        if (cloud.gems > STATE.gems) STATE.gems = cloud.gems;
        if (cloud.ownedSkins) {
          Object.entries(cloud.ownedSkins).forEach(([id, count]) => {
            if (!STATE.ownedSkins[id] || count > STATE.ownedSkins[id]) {
              STATE.ownedSkins[id] = count;
            }
          });
        }
        if (cloud.equippedSkinId && !STATE.equippedSkinId) {
          STATE.equippedSkinId = cloud.equippedSkinId;
        }
        if (cloud.stats && cloud.stats.totalBoxes > STATE.stats.totalBoxes) {
          STATE.stats = {...STATE.stats, ...cloud.stats};
        }
        if (cloud.pity) STATE.pity = {...STATE.pity, ...cloud.pity};
        if (cloud.missionState) STATE.missionState = {...STATE.missionState, ...cloud.missionState};
        if (cloud.username) STATE.username = cloud.username;
        
        updateGemUI();
        updateCharSkin();
        checkMissions();
        console.log('Cloud load success');
      }
      isCloudLoading = false;
    })
    .catch(err => {
      console.warn('Cloud load failed:', err);
      isCloudLoading = false;
    });
}

function fetchLeaderboard() {

  return db.collection('leaderboard')
    .orderBy('totalBoxes', 'desc')
    .limit(20)
    .get()
    .then(snapshot => {
      const rows = [];
      snapshot.forEach(doc => rows.push({id: doc.id, ...doc.data()}));
      return rows;
    })
    .catch(err => {
      console.warn('Fetch leaderboard failed:', err);
      return [];
    });

// ═══════════════════════════════════════════════
//  SEEDED RNG - Оптимизировано
// ═══════════════════════════════════════════════
function makeRng(seed){
  let s=seed>>>0;
  return()=>{s=(s^s<<13)>>>0;s=(s^s>>7)>>>0;s=(s^s<<17)>>>0;return(s>>>0)/0xffffffff;};
}

// ═══════════════════════════════════════════════
//  CANVAS TEXTURE HELPERS - Оптимизировано с пулом
// ═══════════════════════════════════════════════
const canvasPool = [];
const MAX_POOL_SIZE = 5;

function getPooledCanvas(w, h) {
  for (let i = 0; i < canvasPool.length; i++) {
    const c = canvasPool[i];
    if (c.width >= w && c.height >= h) {
      canvasPool.splice(i, 1);
      c.width = w;
      c.height = h;
      return c;
    }
  }
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

function releaseCanvas(c) {
  if (canvasPool.length < MAX_POOL_SIZE) {
    canvasPool.push(c);
  }
}

function gc(w,h,fn){
  const c = getPooledCanvas(w, h);
  const ctx = c.getContext('2d', { alpha: true });
  fn(ctx, w, h);
  return c;
}

const P={
  fill(ctx,w,h,col){ctx.fillStyle=col;ctx.fillRect(0,0,w,h);},
  grad(ctx,w,h,cols,ax=0,ay=0,bx=null,by=null){
    const g=ctx.createLinearGradient(ax,ay,bx??w,by??h);
    cols.forEach(([s,c])=>g.addColorStop(s,c));
    ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  },
  radGrad(ctx,cx,cy,r0,r1,cols,alpha=1){
    const g=ctx.createRadialGradient(cx,cy,r0,cx,cy,r1);
    cols.forEach(([s,c])=>g.addColorStop(s,c));
    ctx.globalAlpha=alpha;ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(cx,cy,r1,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  },
  hex(ctx,w,h,col,size=20,alpha=1){
    ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.globalAlpha=alpha;
    const s3=Math.sqrt(3);
    const cols = Math.ceil(w/(size*1.5)) + 2;
    const rows = Math.ceil(h/(size*s3)) + 2;
    for(let row=-1;row<rows;row++) {
      for(let col2=-1;col2<cols;col2++){
        const x=col2*size*1.5,y=row*size*s3+(col2%2?size*s3/2:0);
        ctx.beginPath();
        for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;
          i?ctx.lineTo(x+size*Math.cos(a),y+size*Math.sin(a)):ctx.moveTo(x+size*Math.cos(a),y+size*Math.sin(a));}
        ctx.closePath();ctx.stroke();
      }
    }
    ctx.globalAlpha=1;
  },
  stripes(ctx,w,h,col,angle,gap=18,lw=2,alpha=1){
    ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.globalAlpha=alpha;
    ctx.translate(w/2,h/2);ctx.rotate(angle);
    const maxDist = Math.max(w, h) * 2;
    for(let i=-maxDist;i<maxDist;i+=gap){ctx.beginPath();ctx.moveTo(i,-maxDist);ctx.lineTo(i,maxDist);ctx.stroke();}
    ctx.restore();ctx.globalAlpha=1;
  },
  rings(ctx,cx,cy,col,gap=18,lw=1.5,alpha=1){
    ctx.strokeStyle=col;ctx.lineWidth=lw;
    const maxR = Math.max(cx, cy, 400);
    for(let r=gap;r<maxR;r+=gap){ctx.globalAlpha=alpha*(1-r/maxR)*0.9+0.05;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();}
    ctx.globalAlpha=1;
  },
  cracks(ctx,x,y,angle,len,col,lw,depth,rng){
    if(depth<=0||len<4)return;
    ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.globalAlpha=lw*0.18+0.1;
    ctx.beginPath();ctx.moveTo(x,y);
    const nx=x+Math.cos(angle)*len,ny=y+Math.sin(angle)*len;
    ctx.lineTo(nx,ny);ctx.stroke();ctx.globalAlpha=1;
    P.cracks(ctx,nx,ny,angle+(rng()-0.5)*1.2,len*0.72,col,lw*0.75,depth-1,rng);
    if(rng()<0.55)P.cracks(ctx,nx,ny,angle+(rng()-0.5)*2.0,len*0.55,col,lw*0.5,depth-2,rng);
  },
  stars(ctx,w,h,col,count,rng){
    ctx.fillStyle=col;
    for(let i=0;i<count;i++){ctx.globalAlpha=rng()*0.9+0.1;ctx.beginPath();ctx.arc(rng()*w,rng()*h,rng()*1.8+0.3,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
  },
  scan(ctx,w,h,col='#000',gap=4,alpha=0.25){
    ctx.strokeStyle=col;ctx.lineWidth=1;ctx.globalAlpha=alpha;
    for(let y=0;y<h;y+=gap){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    ctx.globalAlpha=1;
  },
  diamonds(ctx,w,h,col,size=24,alpha=0.7){
    ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.globalAlpha=alpha;
    const cols = Math.ceil(w/size) + 2;
    const rows = Math.ceil(h/size) + 2;
    for(let row=-1;row<rows;row++)
      for(let col2=-1;col2<cols;col2++){
        const cx=(col2+(row%2?0.5:0))*size,cy=row*size;
        ctx.beginPath();ctx.moveTo(cx,cy-size*0.5);ctx.lineTo(cx+size*0.5,cy);
        ctx.lineTo(cx,cy+size*0.5);ctx.lineTo(cx-size*0.5,cy);ctx.closePath();ctx.stroke();
      }
    ctx.globalAlpha=1;
  },
  runes(ctx,w,h,col,size=32,rng){
    ctx.strokeStyle=col;ctx.lineWidth=1.5;
    const shapes=[(cx,cy,s)=>{ctx.moveTo(cx,cy-s);ctx.lineTo(cx,cy+s);ctx.moveTo(cx-s*0.6,cy-s*0.3);ctx.lineTo(cx+s*0.6,cy-s*0.3);},(cx,cy,s)=>{ctx.moveTo(cx-s,cy);ctx.lineTo(cx+s,cy);ctx.moveTo(cx,cy-s);ctx.lineTo(cx,cy+s);},(cx,cy,s)=>{ctx.arc(cx,cy,s,0,Math.PI*2);}];
    const cols = Math.floor((w-size)/size);
    const rows = Math.floor((h-size)/size);
    for(let gy=0;gy<rows;gy++)for(let gx=0;gx<cols;gx++){
      const x = size + gx*size;
      const y = size + gy*size;
      ctx.globalAlpha=0.25+rng()*0.4;const shape=shapes[Math.floor(rng()*shapes.length)];
      ctx.beginPath();shape(x,y,size*0.35);ctx.stroke();
    }ctx.globalAlpha=1;
  },
  lava(ctx,w,h,col,bright,rng,count=14){
    for(let i=0;i<count;i++){const sx=rng()*w,sy=rng()*h;P.cracks(ctx,sx,sy,rng()*Math.PI*2,rng()*55+30,col,rng()*3+1.5,5,rng);}
    for(let i=0;i<count*3;i++){P.radGrad(ctx,rng()*w,rng()*h,0,rng()*22+8,[[0,bright],[1,'transparent']],rng()*0.5+0.1);}
  },
  chroma(ctx,w,h,off=4){
    const img=ctx.getImageData(0,0,w,h),out=ctx.createImageData(w,h);
    const w4 = w*4;
    for(let y=0;y<h;y++) {
      const rowOffset = y*w4;
      for(let x=0;x<w;x++){
        const i=rowOffset+x*4;
        const ri=rowOffset+Math.min(w-1,x+off)*4;
        const bi=rowOffset+Math.max(0,x-off)*4;
        out.data[i]=img.data[ri];out.data[i+1]=img.data[i+1];out.data[i+2]=img.data[bi+2];out.data[i+3]=img.data[i+3];
      }
    }
    ctx.putImageData(out,0,0);
  }
};

        const d=Math.hypot(a.x-b.x,a.y-b.y);
        if(d>120)return;
        ctx.globalAlpha=(1-d/120)*0.6;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      });
    });
    
    // Pink accent lines
    ctx.shadowColor='#ff0060';ctx.strokeStyle='#ff0060';
    nodes.forEach((n,i)=>{
      if(i%2===0){
        ctx.globalAlpha=0.5;
        ctx.beginPath();ctx.moveTo(n.x,n.y);
        const angle=rng()*Math.PI*2;
        ctx.lineTo(n.x+Math.cos(angle)*60,n.y+Math.sin(angle)*60);ctx.stroke();
      }
    });
    ctx.shadowBlur=0;
    
    // Glowing orbs
    nodes.forEach(n=>{
      P.radGrad(ctx,n.x,n.y,0,rng()*20+8,[[0,'#00d4ffff'],[0.5,'#0066ff88'],[1,'transparent']],0.7);
    });
    
    // Central visor glow
    P.radGrad(ctx,w/2,h*0.4,0,60,[[0,'#00d4ffaa'],[0.3,'#ff006066'],[0.6,'#000000ff'],[1,'transparent']]);
    
    // Data rain effect
    ctx.fillStyle='#00d4ff';ctx.font='bold 10px monospace';
    for(let i=0;i<20;i++){
      const x=rng()*w,y=rng()*h;
      ctx.globalAlpha=rng()*0.5;
      ctx.fillText(rng()>0.5?'1':'0',x,y);
    }
    
    // Hex pattern overlay
    P.hex(ctx,w,h,'#00d4ff',40,0.1);
    
    // Vignette
    P.radGrad(ctx,w/2,h/2,100,w*0.8,[[0,'transparent'],[1,'#000000ee']]);
    ctx.globalAlpha=1;
  })},

];

let audioCtx=null;
let soundEnabled=true;

function getAudioCtx(){
  if(!audioCtx){
    try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
    catch(e){console.warn('No Web Audio',e);}
  }
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}

let masterGain=null;
function getMasterGain(){
  const ctx=getAudioCtx();if(!ctx)return null;
  if(!masterGain){masterGain=ctx.createGain();masterGain.gain.value=0.35;masterGain.connect(ctx.destination);}
  return masterGain;
}

function toggleSound(){

// Пул осцилляторов для переиспользования
const oscPool = [];
const MAX_OSC_POOL = 10;

function getOscillator(ctx) {
  if (oscPool.length > 0) {
    return oscPool.pop();
  }
  return ctx.createOscillator();
}

function releaseOscillator(osc) {
  if (oscPool.length < MAX_OSC_POOL) {
    oscPool.push(osc);
  }
}

function playNote(freq,dur,type='sine',gainMod=1,delayMs=0){
  if(!soundEnabled)return;
  const ctx=getAudioCtx();if(!ctx)return;
  const mg=getMasterGain();if(!mg)return;
  const t=ctx.currentTime+delayMs/1000;
  const osc=getOscillator(ctx);
  const env=ctx.createGain();
  osc.type=type;osc.frequency.setValueAtTime(freq,t);
  env.gain.setValueAtTime(0,t);
  env.gain.linearRampToValueAtTime(gainMod,t+0.01);
  env.gain.exponentialRampToValueAtTime(0.001,t+dur);
  osc.connect(env);env.connect(mg);
  osc.start(t);osc.stop(t+dur+0.05);
  setTimeout(() => releaseOscillator(osc), (delayMs + dur*1000 + 100));
}

// Кэш для noise буферов
const noiseCache = new Map();

function playNoise(dur,cutoff=800,gainMod=0.15,delayMs=0){
  if(!soundEnabled)return;
  const ctx=getAudioCtx();if(!ctx)return;
  const mg=getMasterGain();if(!mg)return;
  const t=ctx.currentTime+delayMs/1000;
  
  const cacheKey = `${dur}_${cutoff}`;
  let buf = noiseCache.get(cacheKey);
  if (!buf) {
    buf=ctx.createBuffer(1,Math.min(ctx.sampleRate*dur, 44100),ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
    if (noiseCache.size < 10) noiseCache.set(cacheKey, buf);
  }
  
  const src=ctx.createBufferSource();src.buffer=buf;
  const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=cutoff;filt.Q.value=0.8;
  const env=ctx.createGain();env.gain.setValueAtTime(gainMod,t);env.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(filt);filt.connect(env);env.connect(mg);
  src.start(t);src.stop(t+dur+0.05);
}

const rng=Math.random.bind(Math);
function pick(arr){if(!arr||!arr.length)return null;return arr[Math.floor(rng()*arr.length)];}
const RARITY_ORDER={rare:0,epic:1,legend:2,ultra:3};

function addGems(n,earned=true){
  STATE.gems+=n;if(earned)STATE.stats.totalGemsEarned+=n;
  updateGemUI();
  const el=document.getElementById('gem-counter');
  el.classList.remove('gem-pop');void el.offsetWidth;el.classList.add('gem-pop');
  SFX.gemEarn();
}
function spendGems(n){STATE.gems-=n;updateGemUI();}
function updateGemUI(){document.getElementById('gem-value').textContent=STATE.gems.toLocaleString();}

function awardSkin(skinId){
  const skin=SKIN_BY_ID[skinId];
  const isFirst=!STATE.ownedSkins[skinId];
  STATE.ownedSkins[skinId]=(STATE.ownedSkins[skinId]||0)+1;
  if(isFirst){
    STATE.stats.totalSkinsOwned++;
    if(!STATE.stats.rarestSkinId||RARITY_ORDER[skin.rarity]>RARITY_ORDER[SKIN_BY_ID[STATE.stats.rarestSkinId]?.rarity??'rare'])
      STATE.stats.rarestSkinId=skinId;
  }
  return!isFirst;
}

function getPityBonus(boxId){
  if(boxId==='mega')  return Math.min(STATE.pity.mega *0.002,0.05);
  if(boxId==='omega') return Math.min(STATE.pity.omega*0.003,0.06);
  return 0;
}

function showToast(msg,dur=2000){
  const t=document.getElementById('toast');t.textContent=msg;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur);
}

function checkMissions(){
  MISSIONS.forEach(m=>{
    if(STATE.missionState[m.id].claimed)return;
    const val=m.stat==='totalSkinsOwned'?STATE.stats.totalSkinsOwned:STATE.stats[m.stat]||0;
    if(val>=m.target&&!STATE.missionState[m.id].completed){
      STATE.missionState[m.id].completed=true;
      SFX.missionComplete();
      showToast(`🎯 Mission complete: ${m.name}! Claim reward.`,3000);
    }
  });
}

//  OPEN BOX LOGIC
// ═══════════════════════════════════════════════
function rollBox(box){
  STATE.stats.totalBoxes++;
  const results=[];
  addGems(box.baseGems);
  results.push({type:'gems',amount:box.baseGems,base:true});
  for(const roll of box.bonus){
    let chance=roll.c;
    if(roll.type==='skin'&&roll.rarity==='legend'&&box.id==='mega') chance+=getPityBonus('mega');
    if(roll.type==='skin'&&roll.rarity==='ultra'&&box.id==='omega')  chance+=getPityBonus('omega');
    if(rng()<chance){
      if(roll.type==='skin'){
        const skin=pick(BY_RARITY[roll.rarity]);if(!skin)continue;
        const isDup=awardSkin(skin.id);
        const dupGems=isDup?RARITIES[skin.rarity].dupGems:0;
        if(isDup)addGems(dupGems);
        results.push({type:'skin',skin,isDup,dupGems});
        if(roll.rarity==='legend'&&box.id==='mega') STATE.pity.mega=0;
        if(roll.rarity==='ultra' &&box.id==='omega')STATE.pity.omega=0;
      }else if(roll.type==='gems'){
        addGems(roll.amount);results.push({type:'gems',amount:roll.amount,base:false});
      }
    }else{
      if(roll.type==='skin'&&roll.rarity==='legend'&&box.id==='mega') STATE.pity.mega++;
      if(roll.type==='skin'&&roll.rarity==='ultra' &&box.id==='omega')STATE.pity.omega++;
    }
  }
  checkMissions();
  saveState();
  return results;
}

function bootGame(){
const canvas3d=document.getElementById('three-canvas');
const renderer=new THREE.WebGLRenderer({canvas:canvas3d,antialias:true, powerPreference: "high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x03030f);scene.fog=new THREE.FogExp2(0x03030f,0.018);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,0.1,100);
camera.position.set(0,5,13);

// Оптимизированное управление камерой с throttle
let lastCamUpdate = 0;
const camCtrl=(()=>{
  const target=new THREE.Vector3(0,1.5,0);
  let theta=-0.1,phi=1.05,radius=13,isDragging=false,lastX=0,lastY=0,touchDist=0;
  const MIN_R=4,MAX_R=24,MIN_PHI=0.18,MAX_PHI=Math.PI*0.62;
  function apply(){camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));camera.lookAt(target);}
  apply();
  canvas3d.addEventListener('mousedown',e=>{isDragging=true;lastX=e.clientX;lastY=e.clientY;});
  window.addEventListener('mouseup',()=>isDragging=false);
  window.addEventListener('mousemove',e=>{
    if(!isDragging||camCtrl.locked)return;
    const now = performance.now();
    if (now - lastCamUpdate < 16) return;
    lastCamUpdate = now;
    const dx=e.clientX-lastX,dy=e.clientY-lastY;theta-=dx*0.006;phi=Math.max(MIN_PHI,Math.min(MAX_PHI,phi+dy*0.006));lastX=e.clientX;lastY=e.clientY;apply();
  });
  canvas3d.addEventListener('wheel',e=>{if(camCtrl.locked)return;radius=Math.max(MIN_R,Math.min(MAX_R,radius+e.deltaY*0.02));apply();e.preventDefault();},{passive:false});
  canvas3d.addEventListener('touchstart',e=>{if(e.touches.length===1){isDragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;touchDist=Math.sqrt(dx*dx+dy*dy);}e.preventDefault();},{passive:false});
  canvas3d.addEventListener('touchend',()=>{isDragging=false;},{passive:true});
  canvas3d.addEventListener('touchmove',e=>{
    if(camCtrl.locked)return;
    const now = performance.now();
    if (now - lastCamUpdate < 16) return;
    lastCamUpdate = now;
    if(e.touches.length===1&&isDragging){const dx=e.touches[0].clientX-lastX,dy=e.touches[0].clientY-lastY;theta-=dx*0.006;phi=Math.max(MIN_PHI,Math.min(MAX_PHI,phi+dy*0.006));lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;apply();}else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const d=Math.sqrt(dx*dx+dy*dy);radius=Math.max(MIN_R,Math.min(MAX_R,radius-(d-touchDist)*0.04));touchDist=d;apply();}e.preventDefault();
  },{passive:false});
  let lerpActive=false,lerpTheta=0,lerpPhi=0,lerpRadius=0,lerpT=0,lerpDur=0;
  return{locked:false,
    lerpTo(t,p,r,dur=0.7){lerpTheta=t;lerpPhi=p;lerpRadius=r;lerpDur=dur;lerpT=0;lerpActive=true;},
    resetView(){this.lerpTo(-0.1,1.05,13,0.8);},
    focusBox(pos){const dx=pos.x-target.x,dz=pos.z-target.z;lerpTheta=Math.atan2(dx,dz)-0.1;lerpPhi=0.92;lerpRadius=8;lerpDur=0.7;lerpT=0;lerpActive=true;},
    tick(dt){
      if(lerpActive){
        lerpT=Math.min(lerpT+dt/lerpDur,1);
        const e=1-(1-lerpT)**3;
        theta+=(lerpTheta-theta)*e*0.12;phi+=(lerpPhi-phi)*e*0.12;radius+=(lerpRadius-radius)*e*0.12;apply();
        if(lerpT>=1)lerpActive=false;
      }
    }
  };
})();

const geoCache = new Map();
function getCachedGeo(type, ...params) {
  const key = `${type}_${params.join('_')}`;
  if (!geoCache.has(key)) {
    let geo;
    if (type === 'box') geo = new THREE.BoxGeometry(...params);
    else if (type === 'plane') geo = new THREE.PlaneGeometry(...params);
    geoCache.set(key, geo);
  }
  return geoCache.get(key);
}

// Оптимизированная система частиц с пулом
const particlePool = [];
const activeParticles = [];
const MAX_PARTICLES = 50;

function spawnParticles(pos,color,count=70){
  if (activeParticles.length >= MAX_PARTICLES) return;
  
  const g=new THREE.BufferGeometry();const p=new Float32Array(count*3);const v=[];
  for(let i=0;i<count;i++){p[i*3]=pos.x;p[i*3+1]=pos.y;p[i*3+2]=pos.z;v.push({x:(Math.random()-0.5)*6,y:Math.random()*6+1,z:(Math.random()-0.5)*6,drag:0.94+Math.random()*0.04});}
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const m=new THREE.PointsMaterial({color:new THREE.Color(color),size:0.14,transparent:true,opacity:1,depthWrite:false,blending:THREE.AdditiveBlending});
  const pts=new THREE.Points(g,m);scene.add(pts);activeParticles.push({pts,v,p,age:0,max:1.6,count});
}

function tickParticles(dt){
  for(let i=activeParticles.length-1;i>=0;i--){
    const ps=activeParticles[i];ps.age+=dt;const t=ps.age/ps.max;ps.pts.material.opacity=Math.max(0,1-t*t);
    for(let j=0;j<ps.count;j++){const vv=ps.v[j];vv.y-=9*dt;vv.x*=vv.drag;vv.z*=vv.drag;ps.p[j*3]+=vv.x*dt;ps.p[j*3+1]+=vv.y*dt;ps.p[j*3+2]+=vv.z*dt;}
    ps.pts.geometry.attributes.position.needsUpdate=true;
    if(ps.age>=ps.max){
      scene.remove(ps.pts);
      ps.pts.geometry.dispose();
      ps.pts.material.dispose();
      activeParticles.splice(i,1);
    }
  }
}

const anims=[];
function animateOpen(boxMesh,boxDef,rarityHint,onDone){
  const{grp,lid,pLight,origLidY}=boxMesh;const color=boxDef.color;
  let phase=0,t=0;let floatMesh=null;
  const pCount=rarityHint==='ultra'?100:rarityHint==='legend'?80:60;
  camCtrl.focusBox(grp.position);camCtrl.locked=true;
  anims.push({update(dt){
    t+=dt;
    if(phase===0){if(t>=0.7){phase=1;t=0;}}
    else if(phase===1){
      const p=Math.min(t/0.55,1),e=1-(1-p)**2;
      lid.position.y=origLidY+e*2.8;lid.rotation.x=e*1.4;lid.position.z=-e*1.8;pLight.intensity=0.5+Math.sin(t*14)*0.4;
      if(p>=1){
        phase=2;t=0;spawnParticles(grp.position.clone().add(new THREE.Vector3(0,2.2,0)),color,pCount);
        const fMat=new THREE.MeshStandardMaterial({color:new THREE.Color(color),emissive:new THREE.Color(color).multiplyScalar(0.5),metalness:0.8,roughness:0.2,transparent:true});
        floatMesh=new THREE.Mesh(getCachedGeo('box',0.55,0.55,0.55),fMat);floatMesh.position.copy(grp.position).add(new THREE.Vector3(0,1.4,0));scene.add(floatMesh);
      }
    }else if(phase===2){
      const p=Math.min(t/1.0,1);
      if(floatMesh){floatMesh.position.y=grp.position.y+1.4+p*2.4;floatMesh.rotation.y=t*5;floatMesh.material.opacity=1-p;}
      pLight.intensity=Math.max(0,0.7-p*0.7);
      if(p>=1){if(floatMesh){scene.remove(floatMesh);floatMesh.material.dispose();floatMesh=null;}lid.position.y=origLidY;lid.rotation.x=0;lid.position.z=0;pLight.intensity=0.5;camCtrl.resetView();camCtrl.locked=false;onDone();return true;}
    }
    return false;
  }});
}

const clock=new THREE.Clock();let elapsed=0;
let frameCount = 0;
const TARGET_FPS = 60;
const FRAME_TIME = 1000 / TARGET_FPS;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);elapsed+=dt;
  
  frameCount++;
  
  camCtrl.tick(dt);
  
  // Обновление звёздного поля
  const positions = starField.geometry.attributes.position.array;
  for(let i=0;i<particleCount;i++){
    positions[i*3+1] += velocities[i*3+1];
    if(positions[i*3+1] > 45) positions[i*3+1] = 5;
  }
  starField.geometry.attributes.position.needsUpdate = true;
  
  if(!STATE.isAnimating){
    raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(raycastMeshes.map(r=>r.mesh));
    const newHov=hits.length?raycastMeshes.find(r=>r.mesh===hits[0].object)?.boxId:null;
    if(newHov!==hoveredBoxId){if(hoveredBoxId)boxScaleState[hoveredBoxId].target=1;if(newHov)boxScaleState[newHov].target=1.06;hoveredBoxId=newHov;canvas3d.style.cursor=newHov?'pointer':'default';}
  }
  
  // Batch update boxes
  BOXES.forEach((b,i)=>{const bm=boxMeshes[b.id];if(!bm)return;const bs=boxScaleState[b.id];
    if(bs.punchT>0){bs.punchT=Math.max(0,bs.punchT-dt*4);bs.scale=1+Math.sin(bs.punchT*Math.PI)*0.12;}
    else{bs.scale+=(bs.target-bs.scale)*Math.min(1,dt*10);}
    bm.grp.scale.setScalar(bs.scale);bm.grp.position.y=Math.sin(elapsed*1.1+i*1.4)*0.07;bm.grp.rotation.y=Math.sin(elapsed*0.45+i*1.1)*0.08;
    const glowBase=hoveredBoxId===b.id?0.85:0.4;bm.pLight.intensity=glowBase+Math.sin(elapsed*2.2+i*0.8)*0.18;
  });
  
  charGrp.rotation.y=Math.sin(elapsed*0.38)*0.18;charGrp.position.y=Math.sin(elapsed*1.4)*0.05;
  if(STATE.equippedSkinId&&SKIN_BY_ID[STATE.equippedSkinId]?.rarity==='ultra')charLight.intensity=1.4+Math.sin(elapsed*3.5)*0.8;
  
  for(let i=anims.length-1;i>=0;i--)if(anims[i].update(dt))anims.splice(i,1);
  tickParticles(dt);renderer.render(scene,camera);
}

function getRarityHint(results){let best=null;results.forEach(r=>{if(r.type==='skin'){if(best===null||RARITY_ORDER[r.skin.rarity]>RARITY_ORDER[best])best=r.skin.rarity;}});return best;}

function triggerOpen(boxId){
  const box=BOXES.find(b=>b.id===boxId);if(!box||STATE.isAnimating)return;
  if(Date.now()<(STATE.cooldowns[boxId]||0))return;
  if(STATE.gems<box.cost)return;
  if(box.cost>0)spendGems(box.cost);
  if(box.cdMs)STATE.cooldowns[boxId]=Date.now()+box.cdMs;
  STATE.isAnimating=true;renderBoxPanel();
  const results=rollBox(box);
  const rarityHint=getRarityHint(results);
  sfxByRarity(rarityHint);
  animateOpen(boxMeshes[box.id],box,rarityHint,()=>{STATE.isAnimating=false;renderBoxPanel();showResult(results,box,false);});
}

function triggerX10(boxId){
  const box=BOXES.find(b=>b.id===boxId);if(!box||!box.allowX10)return;
  const cost=box.cost*10;if(STATE.gems<cost||STATE.isAnimating)return;
  spendGems(cost);STATE.isAnimating=true;renderBoxPanel();
  const allResults=[];for(let i=0;i<10;i++){const r=rollBox(box);allResults.push(...r);}
  const rarityHint=getRarityHint(allResults);sfxByRarity(rarityHint);
  const bm=boxMeshes[box.id];let burst=0;
  function nextBurst(){if(burst>=3){STATE.isAnimating=false;renderBoxPanel();showResult(allResults,box,true);return;}burst++;spawnParticles(bm.grp.position.clone().add(new THREE.Vector3(0,2,0)),box.color,30);setTimeout(nextBurst,380);}nextBurst();
}

  if(!owned.length){grid.innerHTML=`<div class="empty-inv">No skins yet.<br>Open some boxes to fill your wardrobe!</div>`;return;}
  grid.innerHTML='';
  owned.sort(([a],[b])=>RARITY_ORDER[SKIN_BY_ID[b]?.rarity??'rare']-RARITY_ORDER[SKIN_BY_ID[a]?.rarity??'rare']);
  owned.forEach(([id,count])=>{
    const skin=SKIN_BY_ID[id];const rd=RARITIES[skin.rarity];const url=getSkinDataURL(skin);const eq=STATE.equippedSkinId===id;
    const div=document.createElement('div');div.className=`skin-card ${rd.cardClass}${eq?' equipped':''}${skin.rarity==='ultra'?' ultra-glow-card':''}`;
    div.innerHTML=`${count>1?`<div class="skin-count">×${count}</div>`:''}
      <img class="skin-preview" src="${url}" loading="lazy">
      <div class="skin-name" style="color:${rd.color}">${skin.name}</div>
      <div class="rarity-pill ${rd.pillarClass}">${rd.name}</div>
      ${eq?'<div class="equipped-badge">✓ Equipped</div>':''}`;
    div.onclick=()=>{STATE.equippedSkinId=id;updateCharSkin();updateInventory();SFX.equip();showToast(`Equipped: ${skin.name}`);saveState();};
    grid.appendChild(div);
  });
}

function updateStats(){
  const rSkin=STATE.stats.rarestSkinId?SKIN_BY_ID[STATE.stats.rarestSkinId]:null;const rd=rSkin?RARITIES[rSkin.rarity]:null;
  document.getElementById('stats-body').innerHTML=`
    <div class="stat-row"><span class="stat-label">Boxes Opened</span><span class="stat-value">${STATE.stats.totalBoxes}</span></div>
    <div class="stat-row"><span class="stat-label">Total Gems Earned</span><span class="stat-value" style="color:#ffd700">💎 ${STATE.stats.totalGemsEarned.toLocaleString()}</span></div>
    <div class="stat-row"><span class="stat-label">Current Gems</span><span class="stat-value" style="color:#ffd700">💎 ${STATE.gems.toLocaleString()}</span></div>
    <div class="stat-row"><span class="stat-label">Unique Skins</span><span class="stat-value">${STATE.stats.totalSkinsOwned}</span></div>
    <div class="stat-row"><span class="stat-label">Rarest Skin</span><span class="stat-value" style="color:${rd?.color||'#666'}">${rSkin?rSkin.name:'None'}</span></div>
    <div class="pity-bar-wrap">
      <div class="pity-label">Mega Luck+ (Legend) — streak: ${STATE.pity.mega} ${STATE.pity.mega>=15?'🔥':STATE.pity.mega>=8?'📈':''} <span style="color:rgba(255,255,255,0.35);font-size:0.7em;">(+${(getPityBonus('mega')*100).toFixed(2)}%)</span></div>
      <div class="pity-bar"><div class="pity-fill" style="width:${Math.min(100,STATE.pity.mega/25*100)}%;background:linear-gradient(90deg,#ffaa00,#ff6600);"></div></div>
    </div>
    <div class="pity-bar-wrap">
      <div class="pity-label">Omega Luck+ (Ultra) — streak: ${STATE.pity.omega} ${STATE.pity.omega>=15?'🔥':STATE.pity.omega>=8?'📈':''} <span style="color:rgba(255,255,255,0.35);font-size:0.7em;">(+${(getPityBonus('omega')*100).toFixed(2)}%)</span></div>
      <div class="pity-bar"><div class="pity-fill" style="width:${Math.min(100,STATE.pity.omega/20*100)}%;background:linear-gradient(90deg,#ff4444,#ff0000);"></div></div>
    </div>`;
}

function claimMission(id){
  const m=MISSIONS.find(x=>x.id===id);if(!m)return;
  const ms=STATE.missionState[id];if(!ms.completed||ms.claimed)return;
  ms.claimed=true;addGems(m.reward);SFX.gemClaim();showToast(`🎉 +${m.reward} gems claimed!`);saveState();renderMissions();
}
function renderMissions(){
  const body=document.getElementById('mission-body');body.innerHTML='';
  MISSIONS.forEach(m=>{
    const ms=STATE.missionState[m.id];const val=m.stat==='totalSkinsOwned'?STATE.stats.totalSkinsOwned:STATE.stats[m.stat]||0;const pct=Math.min(100,val/m.target*100);
    const div=document.createElement('div');div.className='mission-item';
    div.innerHTML=`<div class="mission-name">${m.name}</div><div class="mission-desc">${m.desc}</div>
      <div class="mission-prog-bar"><div class="mission-prog-fill" style="width:${pct}%"></div></div>
      <div class="mission-footer"><div class="mission-count">${Math.min(val,m.target)} / ${m.target}</div>
        ${ms.claimed?'<span class="claimed-txt">✓ Claimed</span>':ms.completed?`<button class="claim-btn" onclick="claimMission('${m.id}')">Claim +${m.reward}💎</button>`:`<span class="reward-txt">+${m.reward}💎</span>`}</div>`;
    body.appendChild(div);
  });
}

window.openModal=openModal;window.closeModal=closeModal;window.closeResult=closeResult;
window.triggerOpen=triggerOpen;window.triggerX10=triggerX10;window.claimMission=claimMission;
window.toggleSound=toggleSound;window.openLeaderboard=openLeaderboard;window.promptUsername=promptUsername;

updateGemUI();renderBoxPanel();updateCharSkin();animate();
if(typeof STATE.soundEnabled!=='undefined'){soundEnabled=STATE.soundEnabled;const btn=document.getElementById('sound-btn');btn.textContent=soundEnabled?'🔊 SFX':'🔇 SFX';btn.classList.toggle('muted',!soundEnabled);}
}
</script>
</body>
</html>
